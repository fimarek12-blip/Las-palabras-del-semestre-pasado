    <title>Vocabulario Advanced - Clase</title>
    
    <style>
        :root { --p: #2c3e50; --a: #3498db; --bg: #f4f7f6; --ok: #27ae60; --bad: #e74c3c; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: var(--bg); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px 0;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        /* Título centrado */
        h1 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 1.8rem;
            text-align: center;
        }

        /* Botones para cambiar entre filas */
        .row-selector {
            display: flex;
            gap: 10px;
            width: 90vw;
            max-width: 450px;
            margin-bottom: 15px;
        }

        .row-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--p);
            border-radius: 10px;
            background: white;
            color: var(--p);
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .row-btn.active {
            background: var(--p);
            color: white;
        }

        .card-container { 
            perspective: 1000px; 
            width: 90vw; 
            max-width: 450px; 
            height: 300px; 
            cursor: pointer;
            touch-action: manipulation; 
            -webkit-tap-highlight-color: transparent;
        }

        .card { 
            width: 100%; 
            height: 100%; 
            position: relative; 
            transition: transform 0.4s; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            border-radius: 15px;
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
        }

        .card.flipped { transform: rotateY(180deg); }

        .face { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 25px; 
            box-sizing: border-box; 
            border-radius: 15px; 
            text-align: center; 
            font-size: 1.4rem;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .front { background: white; color: var(--p); font-weight: bold; border: 2px solid #ddd; }
        .back { background: var(--a); color: white; transform: rotateY(180deg); font-size: 1.2rem; }

        .controls { 
            margin-top: 15px;
            display: flex; 
            gap: 10px; 
            width: 90vw; 
            max-width: 450px;
        }

        .action-controls {
            margin-top: 10px;
            display: flex;
            gap: 10px;
            width: 90vw;
            max-width: 450px;
        }

        button { 
            flex: 1; 
            padding: 15px 10px; 
            border: none; 
            border-radius: 12px; 
            background: var(--p); 
            color: white; 
            font-size: 1rem; 
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation; 
        }

        .btn-know { background: var(--ok); }
        .btn-dont-know { background: var(--bad); }

        .info { margin-top: 12px; font-weight: bold; color: #7f8c8d; }
        .btn-invert { 
            background: #8e44ad; 
            color: white; 
            border: none; 
            border-radius: 12px;
            padding: 15px; 
            font-weight: bold; 
            width: 90vw; 
            max-width: 450px;
            cursor: pointer; 
            margin-bottom: 15px; 
            font-size: 1rem;
        }
        @media (max-height: 600px) {
            .card-container { height: 220px; }
            .face { font-size: 1.1rem; }
        }

    </style>
</head>
<body>

    <h1>Un repaso de todas las palabras y frases</h1>
    <button class="btn-invert" onclick="invertirIdiomas()">🔄 Invertir: <span id="modo-texto">Español ➡ Checo</span></button>

    <div class="row-selector">
        <button class="row-btn active" id="btn-fila-no" onclick="setFila('no')">Por aprender (<span id="count-no">0</span>)</button>
        <button class="row-btn" id="btn-fila-si" onclick="setFila('si')">Ya aprendidas (<span id="count-si">0</span>)</button>
    </div>

    <div class="card-container" onclick="flip()">
        <div class="card" id="c">
            <div class="face front" id="q">Cargando...</div>
            <div class="face back" id="a">...</div>
        </div>
    </div>

    <div class="info" id="status">0 / 0</div>

    <div class="controls">
        <button onclick="prev()">⬅ Ant.</button>
        <button onclick="shuffle()">🔀 Mezclar</button>
        <button onclick="next()">Sig. ➡</button>
    </div>

    <div class="action-controls" id="eval-controls">

    // Estados de la app
    let filaActual = 'no'; // 'no' = por aprender, 'si' = ya aprendidas
    let indexActual = 0;
    let invertido = false; // false: Es->Cz, true: Cz->Es

    // Listas dinámicas guardadas en memoria local (LocalStorage) opcionalmente,
    // aquí inicializadas según el estado de la app
    let idSaber = JSON.parse(localStorage.getItem('vocab_si')) || [];
    
    // Generar listas filtradas basadas en las aprendidas
    let listaNo = [];
    let listaSi = [];

    function inicializarListas() {
        listaNo = [];
        listaSi = [];
        todasLasPalabras.forEach((p, index) => {
            if (idSaber.includes(index)) {
                listaSi.push({ ...p, originalIndex: index });
            } else {
                listaNo.push({ ...p, originalIndex: index });
            }
        });
        actualizarContadores();
    }

    function getListaActual() {
        return filaActual === 'no' ? listaNo : listaSi;
    }

    function actualizarContadores() {
        document.getElementById('count-no').innerText = listaNo.length;
        document.getElementById('count-si').innerText = listaSi.length;
    }

    function mostrarTarjeta() {
        const lista = getListaActual();
        const card = document.getElementById('c');
        card.classList.remove('flipped');

        if (lista.length === 0) {
            document.getElementById('q').innerText = "Vacío";
            document.getElementById('a').innerText = "No hay palabras en esta sección";
            document.getElementById('status').innerText = "0 / 0";
            return;
        }

        if (indexActual >= lista.length) indexActual = lista.length - 1;
        if (indexActual < 0) indexActual = 0;

        const item = lista[indexActual];
        
        // Control de inversión de idioma
        const pregunta = invertido ? item.a : item.q;
        const respuesta = invertido ? item.q : item.a;

        document.getElementById('q').innerText = pregunta;
        document.getElementById('a').innerText = respuesta;
        document.getElementById('status').innerText = `${indexActual + 1} / ${lista.length}`;
    }

    function flip() {
        const lista = getListaActual();
        if (lista.length > 0) {
            document.getElementById('c').classList.toggle('flipped');
        }
    }

    function next() {
        const lista = getListaActual();
        if (lista.length > 0) {
            indexActual = (indexActual + 1) % lista.length;
            mostrarTarjeta();
        }
    }

    function prev() {
        const lista = getListaActual();
        if (lista.length > 0) {
            indexActual = (indexActual - 1 + lista.length) % lista.length;
            mostrarTarjeta();
        }
    }

    function shuffle() {
        const lista = getListaActual();
        if (lista.length > 1) {
            for (let i = lista.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                if (filaActual === 'no') {
                    [listaNo[i], listaNo[j]] = [listaNo[j], listaNo[i]];
                } else {
                    [listaSi[i], listaSi[j]] = [listaSi[j], listaSi[i]];
                }
            }
            indexActual = 0;
            mostrarTarjeta();
        }
    }

    function setFila(fila) {
        filaActual = fila;
        indexActual = 0;
        document.getElementById('btn-fila-no').classList.toggle('active', fila === 'no');
        document.getElementById('btn-fila-si').classList.toggle('active', fila === 'si');
        mostrarTarjeta();
    }

    function clasificarPalabra(sabe) {
        const lista = getListaActual();
        if (lista.length === 0) return;

        const itemActual = lista[indexActual];
        const origIndex = itemActual.originalIndex;

        if (sabe && filaActual === 'no') {
            // Mover a "Ya aprendidas"
            idSaber.push(origIndex);
        } else if (!sabe && filaActual === 'si') {
            // Mover de vuelta a "Por aprender"
            idSaber = idSaber.filter(id => id !== origIndex);
        }

        localStorage.setItem('vocab_si', JSON.stringify(idSaber));
        inicializarListas();
        mostrarTarjeta();
    }

    function invertirIdiomas() {
        invertido = !invertido;
        document.getElementById('modo-texto').innerText = invertido ? "Checo ➡ Español" : "Español ➡ Checo";
        mostrarTarjeta();
    }

    // Inicialización al cargar la página
    inicializarListas();
    mostrarTarjeta();
